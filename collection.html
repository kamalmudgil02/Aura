<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection — Aura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="announcement-bar">
        Free shipping on all US orders over $150 · <strong>New drops every Friday</strong>
    </div>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Aura.</a>
            <nav class="nav-links">
                <a href="index.html#men" class="nav-link">Men</a>
                <a href="index.html#women" class="nav-link">Women</a>
                <a href="index.html#footwear" class="nav-link">Footwear</a>
                <a href="index.html#accessories" class="nav-link">Accessories</a>
                <a href="stories.html" class="nav-link">Stories</a>
            </nav>
            <div class="header-actions">
                <a href="admin.html" class="icon-btn" aria-label="Admin" title="Admin"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.573-1.066z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
                <button class="icon-btn cart-icon" id="cart-toggle" aria-label="Cart"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg><span class="cart-count" id="header-cart-count">0</span></button>
                <button class="icon-btn menu-toggle" aria-label="Menu"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
            </div>
        </div>
    </header>

    <main style="padding: var(--space-6) 0; min-height: 60vh;">
        <div class="container">
            <div class="text-center mb-6">
                <h1 class="text-3xl text-uppercase mb-2" id="collection-title">Collection</h1>
                <p class="text-muted" id="collection-desc">Explore our curated selection.</p>
            </div>
            <div class="flex justify-between align-center mb-4 text-sm border-bottom" style="padding-bottom:var(--space-2);">
                <span id="product-count" class="text-muted">0 products</span>
                <div class="flex gap-2 align-center">
                    <span>Sort by:</span>
                    <select class="form-control" id="sort-select" style="width:auto; padding:8px 12px;"><option value="featured">Featured</option><option value="price-low">Price: Low → High</option><option value="price-high">Price: High → Low</option></select>
                </div>
            </div>
            <div class="grid grid-cols-2 md-grid-cols-4 gap-3" id="collection-grid"><div class="text-muted col-span-full text-center p-4">Loading...</div></div>
        </div>
    </main>

    <footer class="site-footer"><div class="container footer-bottom"><p>&copy; 2026 Aura Inc.</p></div></footer>

    <!-- Cart Drawer -->
    <div class="cart-drawer-overlay" id="cart-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header flex justify-between align-center p-4 border-bottom"><h2 class="text-xl fw-bold">Your Cart</h2><button class="icon-btn" id="close-cart" style="font-size:1.5rem;">&times;</button></div>
        <div class="cart-items p-4 flex-col gap-4" id="cart-items-container" style="overflow-y:auto; flex-grow:1;"></div>
        <div class="cart-footer p-4 border-top">
            <div class="flex justify-between mb-4 fw-bold"><span>Subtotal</span><span id="cart-subtotal">$0.00</span></div>
            <button class="btn btn-primary w-full btn-large" id="btn-mock-checkout">Checkout</button>
            <p id="checkout-msg" class="text-xs text-center mt-2" style="display:none;"></p>
        </div>
    </div>

    <script src="store.js"></script>
    <script src="script.js"></script>

    <!-- INLINE collection filter — runs AFTER store.js and script.js load -->
    <script>
    (function() {
        const grid = document.getElementById('collection-grid');
        if (!grid || !window.Store) return;

        // Read category from HASH (e.g. collection.html#men)
        const hash = window.location.hash.replace('#', '').toLowerCase().trim();
        // Also check query param as fallback
        const param = new URLSearchParams(window.location.search).get('category');
        const category = hash || param || 'all';

        console.log('[Collection] category =', category, '| hash =', hash, '| param =', param);

        const names = {
            men: "Men's Collection",
            women: "Women's Collection",
            footwear: "Footwear",
            accessories: "Accessories",
            all: "All Products"
        };

        // Update page title
        const titleEl = document.getElementById('collection-title');
        if (titleEl) titleEl.textContent = names[category] || category.charAt(0).toUpperCase() + category.slice(1);
        document.title = (names[category] || 'Collection') + ' — Aura';

        // Get filtered products
        let products;
        if (category === 'all') {
            products = window.Store.getProducts();
        } else {
            products = window.Store.getProductsByCategory(category);
        }

        // Count
        const countEl = document.getElementById('product-count');
        if (countEl) countEl.textContent = products.length + ' product' + (products.length !== 1 ? 's' : '');

        // Render
        function getImg(p) {
            if (p.variants && p.variants.length && p.variants[0].images && p.variants[0].images.length) return p.variants[0].images[0];
            return p.image || 'https://via.placeholder.com/400x500?text=No+Image';
        }
        function cardHTML(p) {
            const img = getImg(p);
            const badges = [];
            if (p.isNew) badges.push('<span class="badge-new">New</span>');
            if (p.isBestSeller) badges.push('<span class="badge-best">Best Seller</span>');
            return `<div class="product-card">
                <a href="product.html#${p.id}" class="product-img-link">
                    <div class="product-img-container"><img src="${img}" alt="${p.title}" loading="lazy">${badges.join('')}</div>
                </a>
                <div class="product-info">
                    <h3 class="product-title">${p.title}</h3>
                    <p class="product-price">$${p.price.toFixed(2)}</p>
                    <p class="product-sizes text-xs text-muted">Sizes: ${(p.sizes||[]).join(', ')}</p>
                </div>
                <button class="btn btn-outline w-full btn-quick-add" data-id="${p.id}">Quick Add</button>
            </div>`;
        }

        function renderGrid(prods) {
            grid.innerHTML = prods.length
                ? prods.map(cardHTML).join('')
                : '<div class="text-muted col-span-full p-4 text-center">No products found in this category.</div>';
        }
        renderGrid(products);

        // Sort
        const sortSelect = document.getElementById('sort-select');
        if (sortSelect) {
            sortSelect.addEventListener('change', function() {
                let s = [...products];
                if (this.value === 'price-low') s.sort((a, b) => a.price - b.price);
                else if (this.value === 'price-high') s.sort((a, b) => b.price - a.price);
                renderGrid(s);
            });
        }
    })();
    </script>
</body>
</html>
